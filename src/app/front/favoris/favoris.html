<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Mes favoris</h1>
  @if (favoris().length > 0) {
    <button type="button" class="btn btn-outline-secondary btn-sm" (click)="onVider()">
      Vider mes favoris
    </button>
  }
</div>

@if (erreur()) {
  <div class="alert alert-danger">{{ erreur() }}</div>
}

<div class="row g-4">
  @for (produit of favoris(); track produit.id) {
    <div class="col-md-6 col-lg-4">
      <app-produit-item [produit]="produit" (favoriDemande)="onBasculerFavori($event)" (ajoutDemande)="onAjouterAuPanier($event)" />
    </div>
  } @empty {
    <div class="col-12">
      <div class="alert alert-info mb-3">
        Vous n'avez aucun favori pour le moment. Cliquez sur le coeur d'un produit dans la boutique.
      </div>
      <a class="btn btn-primary" routerLink="/">Retour à la boutique</a>
    </div>
  }
</div>
